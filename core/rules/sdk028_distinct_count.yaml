rule_id: SDK028
title: "distinct().count() is a two-pass operation"
severity: warning
category: performance
languages: [python, scala, java]
explanation: >-
  When preceded by a column selection (.select() or column subscript),
  distinct().count() forces two passes — a shuffle to deduplicate, then a
  second action to count. countDistinct() combines both into a single
  aggregate. This rule only fires when countDistinct() is a valid
  replacement (column-selected data), not on whole-row distinct().count()
  where there is no single-pass alternative.
suggestion: >-
  Use countDistinct() for exact counts or approx_count_distinct() for
  faster approximate counts:

    from pyspark.sql.functions import countDistinct, approx_count_distinct
    df.agg(countDistinct("user_id"))
    df.agg(approx_count_distinct("user_id", rsd=0.05))

  Note: countDistinct() ignores NULLs while distinct().count() treats
  NULL as a distinct value. Verify your query does not rely on counting
  NULLs before switching.
